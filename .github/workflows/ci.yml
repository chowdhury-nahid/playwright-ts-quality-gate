name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Start the app under test
        run: npm run sut:up
      - name: Run tests
        run: npx playwright test --project=api --project=e2e-chromium
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: App logs on failure
        if: failure()
        run: docker compose -f sut/docker-compose.yml logs --no-color
      - name: Stop the app
        if: always()
        run: npm run sut:down
