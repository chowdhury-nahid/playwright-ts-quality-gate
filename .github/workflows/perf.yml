name: perf

# The load test. Weekly, and on demand. It is not a required check for merging (ADR 0006): a red run here says the app
# got slower or less reliable under load, and it is looked at, but it never blocks a pull request.
on:
  schedule:
    # Mondays, away from nightly (00:59) and canary (01:47).
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      rate:
        description: Browse iterations per second (the thresholds were measured at 16)
        required: false
        default: '16'
      duration:
        description: How long to hold the rate
        required: false
        default: '60s'
      max_vus:
        description: Cap on virtual users for the browse scenario (about 0.55 per iteration a second)
        required: false
        default: '40'

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Start the app under test
        run: npm run sut:up
      # Pinned to the version every measured run used, so the thresholds stay comparable. Dependabot does not watch
      # this: bump it by hand and say so in docs/FEATURES.md.
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'
      - name: Record the k6 version
        run: k6 version
      - name: Run the load test
        env:
          PERF_BASE_URL: http://localhost:3001
          PERF_RATE: ${{ inputs.rate || '16' }}
          PERF_DURATION: ${{ inputs.duration || '60s' }}
          PERF_MAX_VUS: ${{ inputs.max_vus || '40' }}
        # k6 does not create the directory it writes the summary into, so the first run lost the file.
        run: |
          mkdir -p perf/results
          k6 run --quiet perf/articles-browse.ts
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-summary
          path: perf/results/
          retention-days: 30
      - name: App logs on failure
        if: failure()
        run: docker compose -f sut/docker-compose.yml logs --no-color
      - name: Stop the app
        if: always()
        run: npm run sut:down
